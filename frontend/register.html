<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudCart | Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <nav class="nav">
    <a class="brand" href="/">Cloud<span>Cart</span></a>
    <div class="nav-links">
      <a href="/products.html">Products</a>
      <a href="/cart.html" class="cart-link">
        Cart
        <span class="cart-badge" data-count="0">0</span>
      </a>
    </div>
  </nav>
</header>

<main class="container narrow" style="padding-top:60px">
  <div class="form-card">
    <h1>Create Account</h1>
    <p class="form-subtitle">Join CloudCart and start shopping.</p>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password <small style="font-weight:400;color:var(--text-muted)">(min 8 characters)</small></label>
        <input id="password" type="password" autocomplete="new-password" required placeholder="••••••••" minlength="8" />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required placeholder="••••••••" />
      </div>

      <button class="btn btn-primary btn-full" type="submit">Create Account</button>

      <div class="form-message" id="form-message"></div>
    </form>

    <p class="form-footer">
      Already have an account? <a href="/login.html">Login →</a>
    </p>
  </div>
</main>

<div id="toast-container"></div>
<script src="/js/app.js"></script>
</body>
</html>
