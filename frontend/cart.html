<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudCart | Cart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <nav class="nav">
    <a class="brand" href="/">Cloud<span>Cart</span></a>
    <div class="nav-links">
      <a href="/products.html">Products</a>
      <a href="/cart.html" class="cart-link">
        Cart
        <span class="cart-badge" data-count="0">0</span>
      </a>
      <a href="/orders.html" data-auth="logged-in" style="display:none">Orders</a>
      <a href="/login.html"    data-auth="logged-out">Login</a>
      <a href="/register.html" data-auth="logged-out">Register</a>
      <a href="#" data-auth="logged-in" data-action="logout" class="nav-logout" style="display:none">Logout</a>
    </div>
  </nav>
</header>

<main class="container" style="max-width:720px">
  <div class="page-header">
    <h1>Your Cart</h1>
  </div>

  <div id="cart"></div>

  <div class="cart-summary" id="cart-summary" style="display:none">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-amount">₹0.00</span>
    </div>
    <button id="checkout-btn" class="btn btn-primary btn-full" onclick="checkout()">
      Place Order
    </button>
  </div>
</main>

<div id="toast-container"></div>
<script src="/js/app.js"></script>
</body>
</html>
